<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Integral ENEM | Entrar</title>
  <link rel="icon" href="/imagens/integral-logo.png" type="image/png">
  <link rel="apple-touch-icon" sizes="180x180" href="imagens/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="imagens/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="imagens/favicon-16x16.png">
  <link rel="manifest" href="imagens/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login/index.css">
</head>
<body>

  <main class="l-wrap">
    <div class="l-card">

      <!-- Logo -->
      <div class="l-logo">
        <img src="imagens/integral-black-logo.png" alt="Integral ENEM" />
      </div>

      <!-- Header -->
      <div class="l-header">
        <h1 class="l-title">Bem-vindo de volta</h1>
        <p class="l-subtitle">Insira suas credenciais para acessar a plataforma</p>
      </div>

      <!-- Error banner -->
      <div class="l-alert l-alert--error" id="loginError" hidden role="alert">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span id="loginErrorText"></span>
      </div>

      <!-- Success banner (recovery) -->
      <div class="l-alert l-alert--success" id="loginSuccess" hidden role="status">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
        <span id="loginSuccessText"></span>
      </div>

      <!-- Form -->
      <form class="l-form" id="loginForm" onsubmit="handleLogin(event)" novalidate>

        <!-- E-mail -->
        <div class="l-field">
          <label class="l-field__label" for="email">E-mail</label>
          <div class="l-field__wrap">
            <span class="l-field__icon" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
              </svg>
            </span>
            <input
              class="l-field__input"
              type="email"
              id="email"
              placeholder="seu@email.com"
              autocomplete="email"
              inputmode="email"
            />
          </div>
        </div>

        <!-- Senha -->
        <div class="l-field">
          <label class="l-field__label" for="password">Senha</label>
          <div class="l-field__wrap">
            <span class="l-field__icon" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input
              class="l-field__input"
              type="password"
              id="password"
              placeholder="••••••••"
              autocomplete="current-password"
            />
            <button type="button" class="l-field__eye" id="togglePwd" aria-label="Mostrar senha">
              <!-- eye -->
              <svg id="eyeShow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
              </svg>
              <!-- eye-off -->
              <svg id="eyeHide" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden>
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Botão entrar -->
        <button type="submit" class="l-btn" id="loginBtn">
          <span class="l-btn__label">Entrar</span>
          <span class="l-btn__spinner" hidden aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
            </svg>
          </span>
        </button>

      </form>

      <!-- Divisor -->
      <div class="l-divider" aria-hidden="true"><span>ou</span></div>

      <!-- Recuperar senha -->
      <button type="button" class="l-recovery" id="recoveryBtn">
        Esqueci minha senha
      </button>

      <p class="l-footer">Integral ENEM &nbsp;·&nbsp; Todos os direitos reservados</p>

    </div>
  </main>

  <script src="/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/login/index.js"></script>
</body>
</html>
